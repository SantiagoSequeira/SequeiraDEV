<template>
    <lightning-card title="HelloForEach" icon-name="custom:custom14">
        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
                <tr class="slds-line-height_reset">
                    <th class="" scope="col">
                    <div class="slds-truncate" title="Cuenta">Cuenta</div>
                    </th>
                    <th class="" scope="col">
                    <div class="slds-truncate" title="AsignadoA">Asignado a</div>
                    </th>
                </tr>
            </thead>
            <tbody>
                <template for:each={contacts} for:item="contact">
                    <tr key={contact.Id}  class="slds-hint-parent">
                        <th scope="row">
                            <div class="slds-truncate">
                                <lightning-formatted-text value={contact.Name}></lightning-formatted-text> 
                            </div>
                        </th>
                        <th scope="row">
                            <div class="slds-truncate">
                                <input type="text" value={contact.AssignedTo}/>
                            </div>
                        </th>
                    </tr>
                </template>
            </tbody>
        </table>
        <lightning-button variant="Brand" label="Save" title="Save" onclick={save} class="slds-m-left_x-small"></lightning-button>
    </lightning-card>
    <lightning-card title="Movimientos">
        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
                <tr class="slds-line-height_reset">
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Cuenta">Cuenta</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Accion">Fecha</div>
                    </th>
                    <th>
                        <div class="slds-truncate" title="Desc">Descripcion</div>
                    </th>
                </tr>
            </thead>
            <tbody>
                <template for:each={acciones} for:item="accion">
                    <tr key={accion.Id}  class="slds-hint-parent">
                        <th scope="row">
                            <div class="slds-truncate">
                                <lightning-formatted-text value={accion.AccountName}></lightning-formatted-text> 
                            </div>
                        </th>
                        <th scope="row">
                            <div class="slds-truncate">
                                FECHA
                            </div>
                        </th>
                        <th scope="row">
                            <div class="slds-truncate">
                                <lightning-button onclick={openModal} variant="Brand" id={accion.AccountName} label="details" title="details" class="slds-m-left_x-small"></lightning-button>
                            </div>
                        </th>
                    </tr>
                </template>
            </tbody>
        </table>
    </lightning-card>
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <div class="slds-modal__container">
              <header class="slds-modal__header">
                <!-- if:true={showModel}-->
                <lightning-button-icon icon-name="utility:close" class="slds-float_right" onclick={closemodal} alternative-text="close"></lightning-button-icon>
                <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{modalHeading}</h2>
              </header>
              <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                  <div class="slds-is-relative">
                    <!--lightning-spinner alternative-text="Loading" size="large"></!--lightning-spinner-->
                    {accountId}
                </div>
              </div>
              <footer class="slds-modal__footer">
                <lightning-button variant="neutral" label="Close" title="Close" onclick={closeModal}
                    class="slds-m-left_x-small"></lightning-button>
              </footer>
            </div>
          </section>
          <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
