<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon" disabled={isLoading} onclick={handleCancel}>
                <lightning-icon icon-name="utility:close" alternative-text="Cerrar" title="Cerrar" variant="inverse"></lightning-icon>
            </button>
            <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Insertar campo</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <div style="position: relative;">
                    <lightning-spinner alternative-text="Loading" size="medium" if:true={isLoading}></lightning-spinner>
                    <lightning-accordion>
                        <lightning-accordion-section name="A" label="Solicitud">
                            <div class="flex-box">
                                <template for:each={camposSolicitud} for:item="campo">
                                    <lightning-button class="btn" label={campo.fieldLabel} onclick={handleSelectField} variant="brand-outline" key={campo.fieldName} data-id={campo.fieldName}></lightning-button>
                                </template>
                            </div>
                        </lightning-accordion-section>
                        <lightning-accordion-section name="B" label="Tipo de servicio">
                            <div class="flex-box">
                                <template for:each={camposServicio} for:item="campo">
                                    <lightning-button class="btn" label={campo.fieldLabel} onclick={handleSelectField} variant="brand-outline" key={campo.fieldName} data-id={campo.fieldName}></lightning-button>
                                </template>
                            </div>
                        </lightning-accordion-section>
                        <lightning-accordion-section name="C" label="Usuario">
                            <div class="flex-box">
                                <template for:each={camposUsuario} for:item="campo">
                                    <lightning-button class="btn" label={campo.fieldLabel} onclick={handleSelectField} variant="brand-outline" key={campo.fieldName} data-id={campo.fieldName}></lightning-button>
                                </template>
                            </div>
                        </lightning-accordion-section>
                        <lightning-accordion-section name="D" label="Otros">
                            <lightning-button class="btn" label="Campo Generico" onclick={handleSelectField} variant="brand-outline" data-id="GENERIC_FIELD"></lightning-button>
                        </lightning-accordion-section>
                    </lightning-accordion>
                </div>
            </div>
            <div class="slds-modal__footer">
                <div style="display: flex;justify-content:end">
                    <div style="margin: 0 5px;">
                        <lightning-button label="Cancelar" onclick={handleCancel} variant="brand-outline" disabled={isLoading}></lightning-button>
                    </div>
                    <div style="margin: 0 5px;">
                        <lightning-button label={okButtonLabel} onclick={handleOkay} variant="brand" disabled={isLoading}></lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
